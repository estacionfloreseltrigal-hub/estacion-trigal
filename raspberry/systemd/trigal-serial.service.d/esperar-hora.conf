# /etc/systemd/system/trigal-serial.service.d/esperar-hora.conf
# RECONSTRUIDO: el original se entregó en entrega_ciclos.zip y no quedó en las conversaciones.
# El registro de la Pi confirma que esperar-hora corre antes de arrancar el puente.
# Comparar con el de la Pi: systemctl cat trigal-serial
[Service]
ExecStartPre=/usr/local/bin/esperar-hora
TimeoutStartSec=infinity
